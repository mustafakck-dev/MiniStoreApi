services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ministore-database

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"

    ports:
      - "${DATABASE_PORT}:1433"

    volumes:
      - ministore-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ministore-api

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__sqlConnection: "Server=database,1433;Database=${DATABASE_NAME};User Id=${DATABASE_USER};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__redisConnection: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"

    ports:
      - "${API_PORT}:8080"

    depends_on:
      database:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: ministore-redis

    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ministore-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  ministore-sql-data: